name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Restore dependencies
      id: yarn-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          **/node_modules
          .yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}
        # No bare "-yarn-" fallback: restoring node_modules from a different
        # yarn.lock era and running an incremental install over it can strip
        # bin exec bits (rnc-cli → autolinking "npx exit 127"), and the broken
        # tree then gets re-cached under the current key.
        restore-keys: |
          ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: yarn install --immutable
      shell: bash

    # Backstop for the exec-bit loss above: a .bin entry whose target isn't
    # executable fails as "npx exit 126/127" deep inside gradle with no stderr.
    - name: Repair bin permissions
      run: |
        for bin in node_modules/.bin */node_modules/.bin; do
          [ -d "$bin" ] || continue
          for link in "$bin"/*; do
            target=$(readlink -f "$link" 2>/dev/null) || continue
            if [ -f "$target" ] && [ ! -x "$target" ]; then
              echo "repairing exec bit: $target"
              chmod +x "$target"
            fi
          done
        done
      shell: bash

    - name: Cache dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          **/node_modules
          .yarn/install-state.gz
        key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
