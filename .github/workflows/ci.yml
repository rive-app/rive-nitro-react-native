name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

jobs:
  lint-swift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config .swiftlint.yml

  lint-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          ktlint_version: "1.5.0"
          fail_on_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Validate Nitrogen Generated Code
        run: |
          yarn nitrogen
          if ! git diff --exit-code -I 'Copyright © [0-9]* Marc Rousavy @ Margelo' nitrogen/generated/; then
            echo "Error: nitrogen/generated/ is out of date. Please run 'yarn nitrogen' and commit the changes."
            exit 1
          fi

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare
  build-android:
    # Builds the Expo 57 example — the default Android build on CI. Shares
    # its build cache key with the test-harness-android job (cache warmer +
    # exact-key short-circuit). The bare example is built by the scheduled
    # bare-example workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Exact-key probe only (no download): on a hit the build is already
      # proven for these inputs and the whole job short-circuits.
      - name: Check Android build cache
        id: build-cache-check
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/android/app/build
          key: ${{ runner.os }}-android-build-expo57-${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('package.json', 'yarn.lock', 'android/**', 'nitrogen/generated/android/**', 'expo57-example/package.json', 'expo57-example/app.json', 'expo57-example/app.config.js', 'expo57-example/assets/**') }}
          lookup-only: true

      # react-native 0.86 requires node ^20.19.4 — see build-ios. Gradle also
      # shells out to node for autolinking.
      - name: Use Node 22
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JDK
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          for i in 1 2 3; do
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "NDK install attempt $i failed, retrying..."
            sleep 10
          done

      - name: Expo prebuild
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        working-directory: expo57-example
        run: npx expo prebuild -p android --no-install

      - name: Cache Gradle
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-harness-${{ hashFiles('expo57-example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-harness-
            ${{ runner.os }}-gradle-

      - name: Build Android app
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        working-directory: expo57-example/android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=x86_64

      - name: Save Android build cache
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/android/app/build
          key: ${{ steps.build-cache-check.outputs.cache-primary-key }}

  build-ios:
    # Builds the Expo 57 example — the default iOS build on CI. It uses
    # Expo's precompiled React Native XCFrameworks plus the EAS prebuilt
    # third-party pods, so a cold build is ~2.5x faster than the bare
    # example (which the test-harness-ios jobs still build and exercise).
    # Pinned: macos-latest is mid-migration to macOS 26, whose simulator set
    # has no iPhone 16 Pro on an iOS >=26 runtime, breaking the harness boot.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODE_VERSION: 26.3
      # Same bucket EAS Build uses for prebuilt third-party XCFrameworks
      # (reanimated, worklets, ...). Unofficial endpoint — on 404 or if it
      # ever breaks, pods silently fall back to building from source.
      EXPO_PRECOMPILED_MODULES_BASE_URL: https://storage.googleapis.com/eas-build-precompiled-modules/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Exact-key probe only (no download): on a hit the build is already
      # proven for these inputs and the whole job short-circuits.
      - name: Check iOS build cache
        id: build-cache-check
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/build
          key: ${{ runner.os }}-ios-build-expo57-${{ env.XCODE_VERSION }}-${{ hashFiles('package.json', 'yarn.lock', 'ios/**', 'nitrogen/generated/ios/**', '*.podspec', 'src/specs/*.nitro.ts', 'expo57-example/package.json', 'expo57-example/app.json', 'expo57-example/app.config.js', 'expo57-example/assets/**', 'expo57-example/app/**', 'expo57-example/babel.config.js', 'expo57-example/metro.config.js') }}
          lookup-only: true

      # react-native 0.86 requires node ^20.19.4; .nvmrc (20.19.0) is too old
      # for expo prebuild/codegen, so override node here only.
      - name: Use Node 22
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use appropriate Xcode version
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Expo prebuild
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        working-directory: expo57-example
        run: npx expo prebuild -p ios --no-install

      - name: Restore cocoapods
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        id: cocoapods-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/Pods
          key: ${{ runner.os }}-cocoapods-expo57-${{ hashFiles('package.json', 'yarn.lock', '*.podspec', 'expo57-example/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-expo57-

      - name: Install cocoapods
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        working-directory: expo57-example/ios
        run: pod install

      - name: Save cocoapods cache
        if: steps.build-cache-check.outputs.cache-hit != 'true' && steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/ios/Pods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      # Second restore (with download + prefix fallback) so xcodebuild can
      # reuse a previous build dir incrementally.
      - name: Restore iOS build cache
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/build
          key: ${{ steps.build-cache-check.outputs.cache-primary-key }}
          restore-keys: |
            ${{ runner.os }}-ios-build-expo57-${{ env.XCODE_VERSION }}-

      - name: Build expo57-example for iOS
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        working-directory: expo57-example/ios
        run: |
          set -o pipefail && xcodebuild \
            -derivedDataPath build \
            -workspace expo57example.xcworkspace \
            -scheme expo57example \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Save iOS build cache
        if: steps.build-cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/ios/build
          key: ${{ steps.build-cache-check.outputs.cache-primary-key }}
  test-harness-ios:
    # Runs the shared harness suite against the Expo 57 example. The build
    # cache is shared with build-ios (same key), so this job usually only
    # boots the simulator and runs tests.
    # Pinned to macos-15 — see build-ios. macos-26 runners lack a matching
    # iPhone 16 Pro / iOS >=26 simulator, so the boot step fails intermittently.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_VERSION: 26.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # react-native 0.86 requires node ^20.19.4 — see build-ios.
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Expo prebuild
        working-directory: expo57-example
        run: npx expo prebuild -p ios --no-install

      - name: Restore iOS build cache
        id: ios-build-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/build
          key: ${{ runner.os }}-ios-build-expo57-${{ env.XCODE_VERSION }}-${{ hashFiles('package.json', 'yarn.lock', 'ios/**', 'nitrogen/generated/ios/**', '*.podspec', 'src/specs/*.nitro.ts', 'expo57-example/package.json', 'expo57-example/app.json', 'expo57-example/app.config.js', 'expo57-example/assets/**', 'expo57-example/app/**', 'expo57-example/babel.config.js', 'expo57-example/metro.config.js') }}
          restore-keys: |
            ${{ runner.os }}-ios-build-expo57-${{ env.XCODE_VERSION }}-

      - name: Restore cocoapods
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        id: cocoapods-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/Pods
          key: ${{ runner.os }}-cocoapods-expo57-${{ hashFiles('package.json', 'yarn.lock', '*.podspec', 'expo57-example/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-expo57-

      - name: Install cocoapods
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        working-directory: expo57-example/ios
        env:
          # Same bucket EAS Build uses — see build-ios.
          EXPO_PRECOMPILED_MODULES_BASE_URL: https://storage.googleapis.com/eas-build-precompiled-modules/
        run: pod install

      - name: Save cocoapods cache
        if: steps.ios-build-cache.outputs.cache-hit != 'true' && steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/ios/Pods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Build iOS app
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        working-directory: expo57-example/ios
        run: |
          set -o pipefail && xcodebuild \
            -derivedDataPath build \
            -workspace expo57example.xcworkspace \
            -scheme expo57example \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Save iOS build cache
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/ios/build
          key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: 'iPhone 16 Pro'
          os_version: '>=26.0'

      - name: Install app on simulator
        run: xcrun simctl install booted expo57-example/ios/build/Build/Products/Debug-iphonesimulator/expo57example.app

      - name: Wait for simulator to be fully ready
        run: |
          echo "Waiting for simulator to be fully ready..."
          sleep 10
          xcrun simctl list devices | grep Booted

      - name: Run harness tests on iOS
        working-directory: expo57-example
        timeout-minutes: 15
        shell: bash --noprofile --norc -o pipefail {0}
        env:
          # First attempt bundles through the harness Metro on app boot; CI
          # cold transforms can exceed the default 90s bridge window.
          HARNESS_BRIDGE_TIMEOUT: '180000'
          # Debug logging to pin down ios-harness-startup-hang (#328).
          HARNESS_DEBUG: '1'
        run: |
          # Background monitor: logs port/process state every 10s during an attempt
          start_monitor() {
            (
              while true; do
                sleep 10
                ts=$(date +%H:%M:%S)
                metro=$(lsof -ti:8081 2>/dev/null || echo "no")
                bridge=$(lsof -ti:3001 2>/dev/null || echo "no")
                app=$(pgrep -f expo57example 2>/dev/null || echo "no")
                echo "[$ts] metro:$metro bridge:$bridge app:$app"
              done
            ) &
            MONITOR_PID=$!
          }
          stop_monitor() {
            kill $MONITOR_PID 2>/dev/null || true
            wait $MONITOR_PID 2>/dev/null || true
          }

          wait_for_port_free() {
            local port=$1
            local timeout=${2:-10}
            local i=0
            while lsof -ti:$port >/dev/null 2>&1; do
              if [ $i -ge $timeout ]; then
                echo "  WARNING: port $port still in use after ${timeout}s"
                return 1
              fi
              sleep 1
              i=$((i + 1))
            done
            echo "  port $port is free (${i}s)"
            return 0
          }

          nuke_harness() {
            echo "[$(date +%H:%M:%S)] cleanup: killing all harness/metro/node processes"
            pkill -9 -f "react-native-harness" 2>/dev/null || true
            pkill -9 -f "jest" 2>/dev/null || true
            lsof -ti:8081 | xargs kill -9 2>/dev/null || true
            lsof -ti:3001 | xargs kill -9 2>/dev/null || true
            wait_for_port_free 8081
            wait_for_port_free 3001
            # A wedged CoreSimulator hangs harness startup on every retry
            # (ios-harness-startup-hang, #328) — reset it and reboot the sim.
            sudo pkill -9 -f CoreSimulatorService 2>/dev/null || true
            sleep 5
            if [ -n "$BOOTED_UDID" ]; then
              xcrun simctl bootstatus "$BOOTED_UDID" -b || true
            fi
          }

          BOOTED_UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "booted simulator: ${BOOTED_UDID:-none}"

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt of 5 ==="
            start_monitor
            yarn test:harness:ios --verbose --testTimeout 120000 &
            test_pid=$!
            ( sleep 300; echo "  WATCHDOG: attempt $attempt exceeded 300s, killing harness"; kill -9 $test_pid 2>/dev/null ) &
            watchdog_pid=$!
            wait $test_pid 2>/dev/null
            exit_code=$?
            kill $watchdog_pid 2>/dev/null || true
            wait $watchdog_pid 2>/dev/null || true
            stop_monitor
            if [ $exit_code -eq 0 ]; then
              echo "Tests passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed (exit $exit_code), retrying..."
            nuke_harness
          done
          echo "All attempts failed"
          exit 1

      - name: Debug - Check for console logs
        if: failure() || cancelled()
        run: |
          echo "=== Metro health ==="
          curl -s --max-time 5 http://localhost:8081/status || echo "Metro not responding"
          echo "=== Metro process ==="
          lsof -i:8081 | head -5 || echo "Nothing on port 8081"
          echo "=== Simulator logs (last 5m) ==="
          xcrun simctl spawn booted log show --predicate 'processImagePath CONTAINS "expo57example"' --last 5m --style compact 2>&1 | tail -200 || echo "No logs found"

      - name: Debug - Collect iOS crash reports
        if: failure() || cancelled()
        run: |
          set +e
          UDID=$(xcrun simctl list devices | awk -F '[()]' '/Booted/{print $2; exit}')
          echo "Booted simulator UDID: ${UDID:-<none>}"
          mkdir -p crash-reports
          # Simulator app crashes are written to the host's DiagnosticReports by
          # ReportCrash, and sometimes inside the simulator's own data dir. Grab
          # RiveExample-named reports plus anything from the last 25 min as a fallback.
          for dir in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/DiagnosticReports"; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \
              \( -iname 'RiveExample-*' -o \( \( -iname '*.ips' -o -iname '*.crash' \) -mmin -25 \) \) \
              -exec cp {} crash-reports/ \; 2>/dev/null
          done
          count=$(ls -1 crash-reports 2>/dev/null | wc -l | tr -d ' ')
          echo "=== Collected ${count} crash report(s) ==="
          for f in crash-reports/*; do
            [ -e "$f" ] || continue
            echo "---------------- ${f} ----------------"
            cat "$f"
            echo
          done
          if [ "${count}" = "0" ]; then
            echo "No crash reports found (app may not have crashed, or reports were not flushed yet)."
          fi
          exit 0

      - name: Upload iOS crash reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-harness-crash-reports
          path: crash-reports/
          if-no-files-found: ignore

  test-harness-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_API_LEVEL: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # react-native 0.86 requires node ^20.19.4 — see build-ios. Gradle also
      # shells out to node for autolinking.
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          for i in 1 2 3; do
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "NDK install attempt $i failed, retrying..."
            sleep 10
          done

      - name: Expo prebuild
        working-directory: expo57-example
        run: npx expo prebuild -p android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-harness-${{ hashFiles('expo57-example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-harness-
            ${{ runner.os }}-gradle-

      - name: Restore Android build cache
        id: android-build-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/android/app/build
          key: ${{ runner.os }}-android-build-expo57-${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('package.json', 'yarn.lock', 'android/**', 'nitrogen/generated/android/**', 'expo57-example/package.json', 'expo57-example/app.json', 'expo57-example/app.config.js', 'expo57-example/assets/**') }}
          restore-keys: |
            ${{ runner.os }}-android-build-expo57-${{ env.ANDROID_API_LEVEL }}-

      - name: Build Android app
        if: steps.android-build-cache.outputs.cache-hit != 'true'
        working-directory: expo57-example/android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=x86_64

      - name: Save Android build cache
        if: steps.android-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/android/app/build
          key: ${{ steps.android-build-cache.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run harness tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install expo57-example/android/app/build/outputs/apk/debug/app-debug.apk
            sleep 10
            cd expo57-example && for attempt in 1 2 3; do echo "Attempt $attempt of 3"; if timeout 300 env ANDROID_AVD=test yarn test:harness:android --verbose --testTimeout 120000; then echo "Tests passed on attempt $attempt"; exit 0; fi; echo "Attempt $attempt failed (exit $?), retrying..."; sleep 5; done; echo "All attempts failed"; exit 1

      - name: Debug - Check logcat
        if: failure() || cancelled()
        run: |
          echo "=== Checking logcat for errors ==="
          adb logcat -d -s ReactNativeJS:* RNRive:* | tail -200 || echo "No logs found"

  test-harness-ios-legacy:
    # Same as test-harness-ios but with the legacy Rive backend
    # (USE_RIVE_LEGACY=1 pod install).
    runs-on: macos-15
    timeout-minutes: 90
    env:
      XCODE_VERSION: 26.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # react-native 0.86 requires node ^20.19.4 — see build-ios.
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Expo prebuild
        working-directory: expo57-example
        run: npx expo prebuild -p ios --no-install

      - name: Restore iOS build cache
        id: ios-build-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/build
          key: ${{ runner.os }}-ios-legacy-build-expo57-${{ env.XCODE_VERSION }}-${{ hashFiles('package.json', 'yarn.lock', 'ios/**', 'nitrogen/generated/ios/**', '*.podspec', 'src/specs/*.nitro.ts', 'expo57-example/package.json', 'expo57-example/app.json', 'expo57-example/app.config.js', 'expo57-example/assets/**', 'expo57-example/app/**', 'expo57-example/babel.config.js', 'expo57-example/metro.config.js') }}
          restore-keys: |
            ${{ runner.os }}-ios-legacy-build-expo57-${{ env.XCODE_VERSION }}-

      - name: Restore cocoapods
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        id: cocoapods-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/ios/Pods
          key: ${{ runner.os }}-cocoapods-expo57-legacy-${{ hashFiles('package.json', 'yarn.lock', '*.podspec', 'expo57-example/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-expo57-legacy-

      - name: Install cocoapods
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        working-directory: expo57-example/ios
        env:
          # Same bucket EAS Build uses — see build-ios.
          EXPO_PRECOMPILED_MODULES_BASE_URL: https://storage.googleapis.com/eas-build-precompiled-modules/
        run: USE_RIVE_LEGACY=1 pod install

      - name: Save cocoapods cache
        if: steps.ios-build-cache.outputs.cache-hit != 'true' && steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/ios/Pods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Build iOS app
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        working-directory: expo57-example/ios
        run: |
          set -o pipefail && xcodebuild \
            -derivedDataPath build \
            -workspace expo57example.xcworkspace \
            -scheme expo57example \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Save iOS build cache
        if: steps.ios-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/ios/build
          key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: 'iPhone 16 Pro'
          os_version: '>=26.0'

      - name: Install app on simulator
        run: xcrun simctl install booted expo57-example/ios/build/Build/Products/Debug-iphonesimulator/expo57example.app

      - name: Wait for simulator to be fully ready
        run: |
          echo "Waiting for simulator to be fully ready..."
          sleep 10
          xcrun simctl list devices | grep Booted

      - name: Run harness tests on iOS
        working-directory: expo57-example
        timeout-minutes: 15
        shell: bash --noprofile --norc -o pipefail {0}
        env:
          # First attempt bundles through the harness Metro on app boot; CI
          # cold transforms can exceed the default 90s bridge window.
          HARNESS_BRIDGE_TIMEOUT: '180000'
          # Debug logging to pin down ios-harness-startup-hang (#328).
          HARNESS_DEBUG: '1'
        run: |
          # Background monitor: logs port/process state every 10s during an attempt
          start_monitor() {
            (
              while true; do
                sleep 10
                ts=$(date +%H:%M:%S)
                metro=$(lsof -ti:8081 2>/dev/null || echo "no")
                bridge=$(lsof -ti:3001 2>/dev/null || echo "no")
                app=$(pgrep -f expo57example 2>/dev/null || echo "no")
                echo "[$ts] metro:$metro bridge:$bridge app:$app"
              done
            ) &
            MONITOR_PID=$!
          }
          stop_monitor() {
            kill $MONITOR_PID 2>/dev/null || true
            wait $MONITOR_PID 2>/dev/null || true
          }

          wait_for_port_free() {
            local port=$1
            local timeout=${2:-10}
            local i=0
            while lsof -ti:$port >/dev/null 2>&1; do
              if [ $i -ge $timeout ]; then
                echo "  WARNING: port $port still in use after ${timeout}s"
                return 1
              fi
              sleep 1
              i=$((i + 1))
            done
            echo "  port $port is free (${i}s)"
            return 0
          }

          nuke_harness() {
            echo "[$(date +%H:%M:%S)] cleanup: killing all harness/metro/node processes"
            pkill -9 -f "react-native-harness" 2>/dev/null || true
            pkill -9 -f "jest" 2>/dev/null || true
            lsof -ti:8081 | xargs kill -9 2>/dev/null || true
            lsof -ti:3001 | xargs kill -9 2>/dev/null || true
            wait_for_port_free 8081
            wait_for_port_free 3001
            # A wedged CoreSimulator hangs harness startup on every retry
            # (ios-harness-startup-hang, #328) — reset it and reboot the sim.
            sudo pkill -9 -f CoreSimulatorService 2>/dev/null || true
            sleep 5
            if [ -n "$BOOTED_UDID" ]; then
              xcrun simctl bootstatus "$BOOTED_UDID" -b || true
            fi
          }

          BOOTED_UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "booted simulator: ${BOOTED_UDID:-none}"

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt of 5 ==="
            start_monitor
            yarn test:harness:ios --verbose --testTimeout 120000 &
            test_pid=$!
            ( sleep 300; echo "  WATCHDOG: attempt $attempt exceeded 300s, killing harness"; kill -9 $test_pid 2>/dev/null ) &
            watchdog_pid=$!
            wait $test_pid 2>/dev/null
            exit_code=$?
            kill $watchdog_pid 2>/dev/null || true
            wait $watchdog_pid 2>/dev/null || true
            stop_monitor
            if [ $exit_code -eq 0 ]; then
              echo "Tests passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed (exit $exit_code), retrying..."
            nuke_harness
          done
          echo "All attempts failed"
          exit 1

      - name: Debug - Check for console logs
        if: failure() || cancelled()
        run: |
          echo "=== Metro health ==="
          curl -s --max-time 5 http://localhost:8081/status || echo "Metro not responding"
          echo "=== Metro process ==="
          lsof -i:8081 | head -5 || echo "Nothing on port 8081"
          echo "=== Simulator logs (last 5m) ==="
          xcrun simctl spawn booted log show --predicate 'processImagePath CONTAINS "expo57example"' --last 5m --style compact 2>&1 | tail -200 || echo "No logs found"

      - name: Debug - Collect iOS crash reports
        if: failure() || cancelled()
        run: |
          set +e
          UDID=$(xcrun simctl list devices | awk -F '[()]' '/Booted/{print $2; exit}')
          echo "Booted simulator UDID: ${UDID:-<none>}"
          mkdir -p crash-reports
          # Simulator app crashes are written to the host's DiagnosticReports by
          # ReportCrash, and sometimes inside the simulator's own data dir. Grab
          # RiveExample-named reports plus anything from the last 25 min as a fallback.
          for dir in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/DiagnosticReports"; do
            [ -d "$dir" ] || continue
            find "$dir" -type f \
              \( -iname 'RiveExample-*' -o \( \( -iname '*.ips' -o -iname '*.crash' \) -mmin -25 \) \) \
              -exec cp {} crash-reports/ \; 2>/dev/null
          done
          count=$(ls -1 crash-reports 2>/dev/null | wc -l | tr -d ' ')
          echo "=== Collected ${count} crash report(s) ==="
          for f in crash-reports/*; do
            [ -e "$f" ] || continue
            echo "---------------- ${f} ----------------"
            cat "$f"
            echo
          done
          if [ "${count}" = "0" ]; then
            echo "No crash reports found (app may not have crashed, or reports were not flushed yet)."
          fi
          exit 0

      - name: Upload iOS crash reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-harness-legacy-crash-reports
          path: crash-reports/
          if-no-files-found: ignore

  test-harness-android-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_API_LEVEL: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # react-native 0.86 requires node ^20.19.4 — see build-ios. Gradle also
      # shells out to node for autolinking.
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          for i in 1 2 3; do
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" && break
            echo "NDK install attempt $i failed, retrying..."
            sleep 10
          done

      - name: Expo prebuild
        working-directory: expo57-example
        run: npx expo prebuild -p android --no-install

      - name: Enable legacy Rive backend
        run: |
          # The prebuild-generated gradle.properties has no trailing newline;
          # a bare append would glue onto the last property.
          printf '\nUSE_RIVE_LEGACY=true\n' >> expo57-example/android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-harness-legacy-${{ hashFiles('expo57-example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-harness-legacy-
            ${{ runner.os }}-gradle-harness-
            ${{ runner.os }}-gradle-

      - name: Restore Android build cache
        id: android-build-cache
        uses: actions/cache/restore@v4
        with:
          path: expo57-example/android/app/build
          key: ${{ runner.os }}-android-legacy-build-expo57-${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('package.json', 'yarn.lock', 'android/**', 'nitrogen/generated/android/**', 'expo57-example/package.json', 'expo57-example/app.json', 'expo57-example/app.config.js', 'expo57-example/assets/**') }}
          restore-keys: |
            ${{ runner.os }}-android-legacy-build-expo57-${{ env.ANDROID_API_LEVEL }}-

      - name: Build Android app
        if: steps.android-build-cache.outputs.cache-hit != 'true'
        working-directory: expo57-example/android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=x86_64

      - name: Save Android build cache
        if: steps.android-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: expo57-example/android/app/build
          key: ${{ steps.android-build-cache.outputs.cache-primary-key }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run harness tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install expo57-example/android/app/build/outputs/apk/debug/app-debug.apk
            sleep 10
            cd expo57-example && for attempt in 1 2 3; do echo "Attempt $attempt of 3"; if timeout 300 env ANDROID_AVD=test yarn test:harness:android --verbose --testTimeout 120000; then echo "Tests passed on attempt $attempt"; exit 0; fi; echo "Attempt $attempt failed (exit $?), retrying..."; sleep 5; done; echo "All attempts failed"; exit 1

      - name: Debug - Check logcat
        if: failure() || cancelled()
        run: |
          echo "=== Checking logcat for errors ==="
          adb logcat -d -s ReactNativeJS:* RNRive:* | tail -200 || echo "No logs found"
