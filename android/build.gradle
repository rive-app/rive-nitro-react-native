buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['Rive_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/rive+autolinking.gradle'
apply plugin: "com.facebook.react"

react {
  jsRootDir = file("../src/")
  libraryName = "rive"
  codegenJavaPackageName = "com.rive"
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Rive_" + name]).toInteger()
}

def kotlinCoverage = project.hasProperty('Rive_KotlinCoverage') ?
  project.property('Rive_KotlinCoverage').toBoolean() : false

android {
  namespace "com.rive"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  def skipSetup = project.hasProperty('Rive_RiveRuntimeAndroidSkipSetup') ?
    project.property('Rive_RiveRuntimeAndroidSkipSetup').toBoolean() : false

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "RIVE_SKIP_SETUP", "$skipSetup"
    buildConfigField "boolean", "RIVE_KOTLIN_COVERAGE", "$kotlinCoverage"

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      // On Windows the NDK default CMake (3.22.1) fails when object-file
      // paths exceed MAX_PATH (260 chars). Set CMAKE_VERSION=3.31.6 to fix.
      // See: https://docs.swmansion.com/react-native-reanimated/docs/guides/building-on-windows/
      def cmakeVersionOverride = System.getenv("CMAKE_VERSION")
      if (cmakeVersionOverride) {
        version cmakeVersionOverride
      }
    }
  }

  packagingOptions {
    excludes = ["META-INF",
                "META-INF/**",
                "**/libc++_shared.so",
                "**/libfbjni.so",
                "**/libjsi.so",
                "**/libfolly_json.so",
                "**/libfolly_runtime.so",
                "**/libglog.so",
                "**/libhermes.so",
                "**/libhermes-executor-debug.so",
                "**/libhermes_executor.so",
                "**/libreactnative.so",
                "**/libreactnativejni.so",
                "**/libturbomodulejsijni.so",
                "**/libreact_nativemodule_core.so",
                "**/libjscexecutor.so"]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  if (kotlinCoverage) {
    println "@rive-app/react-native: Kotlin code coverage ENABLED"
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += ["generated/java",
                       "generated/jni"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

def getRiveAndroidVersion() {
  if (rootProject.ext.has('RiveRuntimeAndroidVersion')) {
    return rootProject.ext.get('RiveRuntimeAndroidVersion')
  }

  if (project.hasProperty('Rive_RiveRuntimeAndroidVersion')) {
    return project.property('Rive_RiveRuntimeAndroidVersion')
  }

  def packageJson = file("${projectDir}/../package.json")
  if (packageJson.exists()) {
    def json = new groovy.json.JsonSlurper().parseText(packageJson.text)
    if (json.runtimeVersions?.android) {
      return json.runtimeVersions.android
    }
  }

  throw new GradleException("Failed to determine Rive Android SDK version. Please ensure package.json contains 'runtimeVersions.android'")
}

def riveAndroidVersion = getRiveAndroidVersion()
println "@rive-app/react-native: Rive Android SDK ${riveAndroidVersion}"

configurations {
  jacocoAnt
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "app.rive:rive-android:${riveAndroidVersion}"
  implementation project(":react-native-nitro-modules")

  if (kotlinCoverage) {
    implementation "org.jacoco:org.jacoco.agent:0.8.12:runtime"
    jacocoAnt "org.jacoco:org.jacoco.ant:0.8.12"
  }
}

if (kotlinCoverage) {
  afterEvaluate {
    def classesDir = file("${buildDir}/tmp/kotlin-classes/debug")

    tasks.named("compileDebugKotlin").configure {
      doLast {
        if (!classesDir.exists()) return

        // Save a copy of the original (uninstrumented) classes for report generation
        def origDir = file("${buildDir}/jacoco-original-classes")
        if (origDir.exists()) origDir.deleteDir()
        ant.copy(todir: origDir) {
          fileset(dir: classesDir)
        }

        // Offline-instrument class files: write to temp dir, then replace originals
        def instrumentedDir = file("${buildDir}/tmp/jacoco-instrumented")
        if (instrumentedDir.exists()) instrumentedDir.deleteDir()
        instrumentedDir.mkdirs()

        ant.taskdef(
          name: 'instrument',
          classname: 'org.jacoco.ant.InstrumentTask',
          classpath: configurations.jacocoAnt.asPath
        )
        ant.instrument(destdir: instrumentedDir) {
          fileset(dir: classesDir, includes: '**/*.class')
        }

        // Replace original classes with instrumented ones
        ant.copy(todir: classesDir, overwrite: true) {
          fileset(dir: instrumentedDir)
        }

        println "[Coverage] Instrumented classes in ${classesDir}"
      }
    }
  }
}

